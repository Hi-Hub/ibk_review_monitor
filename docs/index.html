<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>IBK 부정 리뷰 모니터링</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F3B66" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root {
    --navy: #1F3B66;
    --steel: #2E5C8A;
    --paper: #F7F8FA;
    --ink: #22262B;
    --ink-soft: #5B6470;
    --line: #E3E7EC;
    --alert: #B23B3B;
    --amber: #C98A1E;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header.topbar {
    background: var(--navy); color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px 16px;
    position: sticky; top: 0; z-index: 20;
  }
  header.topbar h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  header.topbar .meta { margin-top: 4px; font-size: 12px; color: #C9D6E8; display: flex; align-items: center; gap: 8px; }
  .refresh-btn {
    background: rgba(255,255,255,0.14); border: none; color: #fff; border-radius: 8px;
    padding: 4px 10px; font-size: 12px; margin-left: auto; cursor: pointer;
  }
  .refresh-btn:active { background: rgba(255,255,255,0.28); }

  nav.tabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px;
    background: var(--steel); position: sticky; top: 0; z-index: 19;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 0 0 auto; border: none; padding: 7px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.12); color: #E7EEF7;
    cursor: pointer; white-space: nowrap;
  }
  nav.tabs button.active { background: #fff; color: var(--navy); }
  nav.tabs button .badge {
    display: inline-block; margin-left: 5px; background: var(--alert); color: #fff;
    font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 5px;
  }
  nav.tabs button.active .badge { background: var(--alert); color: #fff; }

  main { flex: 1; padding: 14px 14px 40px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .stat-row { display: flex; gap: 10px; }
  .stat {
    flex: 1; text-align: center; padding: 10px 4px; border-radius: 10px; background: var(--paper);
  }
  .stat .num { font-size: 22px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .stat.new .num { color: var(--alert); }

  .section-title {
    font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 18px 2px 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .toggle-group { display: flex; gap: 4px; background: var(--line); border-radius: 8px; padding: 2px; }
  .toggle-group button {
    border: none; background: transparent; font-size: 11px; font-weight: 700; color: var(--ink-soft);
    padding: 4px 9px; border-radius: 6px; cursor: pointer;
  }
  .toggle-group button.active { background: #fff; color: var(--navy); }

  .bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .bar-row .name { width: 92px; font-size: 12px; color: var(--ink); flex: 0 0 auto; }
  .bar-row .track { flex: 1; height: 8px; background: var(--paper); border-radius: 999px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--steel); border-radius: 999px; }
  .bar-row .count { width: 34px; text-align: right; font-size: 12px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }

  table.date-table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px; }
  .table-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  table.date-table th, table.date-table td {
    padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.date-table th { color: var(--ink-soft); font-weight: 700; position: sticky; top: 0; background: #fff; }
  table.date-table td.date-col, table.date-table th.date-col {
    position: sticky; left: 0; background: #fff; text-align: left; font-weight: 600;
  }
  table.date-table tr:last-child td { font-weight: 800; background: var(--paper); }

  .channel-header { margin-bottom: 4px; }
  .channel-header .label { font-size: 15px; font-weight: 800; color: var(--navy); }
  .channel-header .platform { font-size: 12px; color: var(--ink-soft); margin-left: 6px; }

  .error-note {
    background: #FBEEEE; color: var(--alert); border-radius: 10px; padding: 12px 14px;
    font-size: 13px; margin-top: 10px;
  }

  .empty-note {
    text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px;
  }

  .review {
    display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line);
  }
  .review:first-child { border-top: none; }
  .review .stripe { width: 3px; border-radius: 3px; flex: 0 0 auto; }
  .review .body { flex: 1; min-width: 0; }
  .review .top-line {
    display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft); flex-wrap: wrap;
  }
  .review .top-line .date { font-variant-numeric: tabular-nums; }
  .review .top-line .dot { rating-dots: none; letter-spacing: 1px; }
  .review .top-line .tag {
    background: var(--paper); border-radius: 999px; padding: 1px 8px; font-weight: 700; color: var(--ink);
  }
  .review .top-line .new-tag {
    background: var(--alert); color: #fff; border-radius: 999px; padding: 1px 8px; font-weight: 700;
  }
  .review .author { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .review .content { font-size: 13.5px; line-height: 1.5; margin-top: 4px; word-break: break-word; }

  footer.appfoot {
    text-align: center; font-size: 11px; color: var(--ink-soft); padding: 6px 14px 24px;
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>IBK 부정 리뷰 모니터링</h1>
    <div class="meta">
      <span id="generatedAt">불러오는 중…</span>
      <button class="refresh-btn" id="refreshBtn">새로고침</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer class="appfoot">Apple/Google 공개 리뷰 기반 · 키워드 기반 자동 분류</footer>
</div>

<script>
const CATEGORY_COLORS = ["#2E5C8A", "#C98A1E", "#5C8A6E", "#8A5C7A", "#B23B3B", "#5B7DA6", "#8A7A5C", "#6E5C8A"];
function colorForCategory(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return CATEGORY_COLORS[h % CATEGORY_COLORS.length];
}
function ratingDots(rating) {
  const filled = "●".repeat(rating);
  const empty = "○".repeat(Math.max(0, 5 - rating));
  return filled + empty;
}

let DATA = null;
let currentTab = "summary";
let summaryView = "channel"; // "channel" | "date"

async function loadData() {
  document.getElementById("generatedAt").textContent = "불러오는 중…";
  try {
    const res = await fetch("./data.json?t=" + Date.now());
    if (!res.ok) throw new Error("data.json 요청 실패");
    DATA = await res.json();
    render();
  } catch (e) {
    document.getElementById("generatedAt").textContent = "데이터를 불러오지 못했습니다";
    document.getElementById("main").innerHTML =
      '<div class="card empty-note">아직 데이터가 없거나 네트워크 문제로 불러오지 못했어요.<br>서버 쪽 자동 실행이 최소 한 번은 완료되어야 내용이 보여요.</div>';
  }
}

function buildTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  const summaryBtn = document.createElement("button");
  summaryBtn.textContent = "요약";
  summaryBtn.className = currentTab === "summary" ? "active" : "";
  summaryBtn.onclick = () => { currentTab = "summary"; render(); };
  tabs.appendChild(summaryBtn);

  DATA.channels.forEach((ch) => {
    const btn = document.createElement("button");
    btn.className = currentTab === ch.key ? "active" : "";
    btn.innerHTML = ch.key + (ch.new_count > 0 ? `<span class="badge">${ch.new_count}</span>` : "");
    btn.onclick = () => { currentTab = ch.key; render(); };
    tabs.appendChild(btn);
  });
}

function renderSummary() {
  const s = DATA.summary;
  const totalNew = DATA.channels.reduce((a, c) => a + c.new_count, 0);
  let html = `
    <div class="card">
      <div class="stat-row">
        <div class="stat"><div class="num">${s.grand_total}</div><div class="label">전체 부정 리뷰</div></div>
        <div class="stat new"><div class="num">${totalNew}</div><div class="label">신규 부정 리뷰</div></div>
      </div>
    </div>
    <div class="section-title">
      <span>채널별 현황</span>
      <div class="toggle-group">
        <button data-v="channel" class="${summaryView === "channel" ? "active" : ""}">채널별 합계</button>
        <button data-v="date" class="${summaryView === "date" ? "active" : ""}">날짜별 표</button>
      </div>
    </div>
  `;

  if (summaryView === "channel") {
    const maxCount = Math.max(1, ...s.channels.map((ch) => s.channel_totals[ch] || 0));
    html += '<div class="card">';
    s.channels.forEach((ch) => {
      const count = s.channel_totals[ch] || 0;
      const pct = Math.round((count / maxCount) * 100);
      html += `
        <div class="bar-row">
          <div class="name">${ch}</div>
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
          <div class="count">${count}</div>
        </div>`;
    });
    html += "</div>";
  } else {
    html += '<div class="card"><div class="table-scroll"><table class="date-table"><thead><tr>';
    html += '<th class="date-col">날짜</th>';
    s.channels.forEach((ch) => (html += `<th>${ch}</th>`));
    html += "<th>합계</th></tr></thead><tbody>";
    s.dates.forEach((row) => {
      html += `<tr><td class="date-col">${row.date}</td>`;
      s.channels.forEach((ch) => (html += `<td>${row.counts[ch] || ""}</td>`));
      html += `<td>${row.total}</td></tr>`;
    });
    if (s.dates.length === 0) {
      html += `<tr><td colspan="${s.channels.length + 2}">수집된 부정 리뷰가 없습니다.</td></tr>`;
    } else {
      html += `<tr><td class="date-col">합계</td>`;
      s.channels.forEach((ch) => (html += `<td>${s.channel_totals[ch] || ""}</td>`));
      html += `<td>${s.grand_total}</td></tr>`;
    }
    html += "</tbody></table></div></div>";
  }

  document.getElementById("main").innerHTML = html;
  document.querySelectorAll(".toggle-group button").forEach((btn) => {
    btn.onclick = () => { summaryView = btn.dataset.v; renderSummary(); };
  });
}

function renderChannel(ch) {
  let html = `
    <div class="card channel-header">
      <span class="label">${ch.key}</span>
      <span class="platform">${ch.app_label} · ${ch.platform}</span>
    </div>
    <div class="card">
      <div class="stat-row">
        <div class="stat"><div class="num">${ch.total}</div><div class="label">부정 리뷰</div></div>
        <div class="stat new"><div class="num">${ch.new_count}</div><div class="label">신규</div></div>
      </div>
      ${ch.error ? `<div class="error-note">${ch.error}</div>` : ""}
    </div>
  `;

  if (ch.reviews.length === 0 && !ch.error) {
    html += '<div class="card empty-note">수집된 부정 리뷰가 없습니다.</div>';
  } else if (ch.reviews.length > 0) {
    html += '<div class="card">';
    ch.reviews.forEach((r) => {
      html += `
        <div class="review">
          <div class="stripe" style="background:${colorForCategory(r.category)}"></div>
          <div class="body">
            <div class="top-line">
              <span class="date">${r.date_disp}</span>
              <span class="dot">${ratingDots(r.rating)}</span>
              <span class="tag">${r.category}</span>
              ${r.is_new ? '<span class="new-tag">신규</span>' : ""}
            </div>
            <div class="author">${escapeHtml(r.author)}</div>
            <div class="content">${escapeHtml(r.content)}</div>
          </div>
        </div>`;
    });
    html += "</div>";
  }

  document.getElementById("main").innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function render() {
  if (!DATA) return;
  document.getElementById("generatedAt").textContent = "마지막 갱신: " + DATA.generated_at;
  buildTabs();
  if (currentTab === "summary") {
    renderSummary();
  } else {
    const ch = DATA.channels.find((c) => c.key === currentTab);
    if (ch) renderChannel(ch);
    else { currentTab = "summary"; renderSummary(); }
  }
}

document.getElementById("refreshBtn").onclick = loadData;
loadData();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>

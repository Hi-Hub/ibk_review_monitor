name: 매일 부정 리뷰 수집

on:
  schedule:
    # UTC 기준 23:00 = 한국시간(KST) 오전 08:00
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 저장소 Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 리뷰 수집 실행 (엑셀 + 폰앱용 data.json 생성)
        run: python review_monitor.py

      - name: 오래된 엑셀/로그 정리 (저장소 용량이 계속 커지지 않도록)
        run: |
          cd reports 2>/dev/null && ls -1t *.xlsx 2>/dev/null | tail -n +31 | xargs -r rm -- ; cd ..
          if [ -f logs/실행로그.txt ]; then
            tail -n 2000 logs/실행로그.txt > logs/실행로그.tmp && mv logs/실행로그.tmp logs/실행로그.txt
          fi

      - name: 결과를 저장소에 커밋
        run: |
          git config user.name "review-monitor-bot"
          git config user.email "actions@github.com"
          git add docs/data.json data/ reports/ logs/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "자동 수집: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
